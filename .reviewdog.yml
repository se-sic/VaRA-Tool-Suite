runner:
  mypy:
    name: mypy
    cmd: mypy --strict --show-column-numbers -p varats
    errorformat:
      - "%f:%l:%c: %m"
    level: error

  pylint:
    name: pylint
    cmd: pylint varats* -j 0
    errorformat:
      - "%f:%l:%c: %t%n: %m"

  ruff:
    name: ruff
    cmd: ruff check --output-format=rdjson
    format: rdjson