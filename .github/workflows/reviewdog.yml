name: reviewdog

on:
  pull_request:
    branches: [ vara, vara-dev ]
  merge_group:
    branches: [ vara, vara-dev ]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies for CI
      run: |
         sudo apt-get install libgraphviz-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -r requirements.txt
        pip install ruff
        pip install ty

    - name: Setup reviewdog
      uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
    - name: Run reviewdog
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        reviewdog -runners=ruff -reporter=github-pr-check -conf=.reviewdog.yml -filter-mode=diff_context
        reviewdog -runners=ty -reporter=github-pr-check -conf=.reviewdog.yml -filter-mode=diff_context
