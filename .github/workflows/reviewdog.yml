name: reviewdog

on:
  pull_request:
    branches: [ vara, vara-dev ]
  merge_group:
    branches: [ vara, vara-dev ]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies for CI
      run: |
         sudo apt-get install libgraphviz-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -r requirements.txt
        pip install mypy
        pip install ruff==0.15.2

    - name: Setup reviewdog
      run: |
        mkdir -p $HOME/bin && curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh| sh -s -- -b $HOME/bin
        echo "$HOME/bin" >> $GITHUB_PATH
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
    - name: Run reviewdog
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        reviewdog -runners=mypy -reporter=github-pr-check -conf=.reviewdog.yml
        reviewdog -runners=ruff -reporter=github-pr-check -conf=.reviewdog.yml -filter-mode=file
