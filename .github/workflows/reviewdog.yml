name: reviewdog

on:
  pull_request:
    branches: [ vara, vara-dev ]
  merge_group:
    branches: [ vara, vara-dev ]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Install system dependencies for CI
      run: |
         sudo apt-get install libgraphviz-dev

    - name: Install dependencies
      run: |
        uv sync --locked --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Setup reviewdog
      uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
    - name: Run reviewdog
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        reviewdog -runners=ruff -reporter=github-pr-check -conf=.reviewdog.yml -filter-mode=diff_context
        reviewdog -runners=ty -reporter=github-pr-check -conf=.reviewdog.yml -filter-mode=diff_context
