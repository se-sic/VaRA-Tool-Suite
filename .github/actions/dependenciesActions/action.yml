name: 'Dependencies Template'
description: 'Install all system and python dependencies'

inputs:
  python-version:
    description: 'Python version to install and use'
    required: true
  uv-sync-args:
    description: 'Additional arguments passed to uv sync, e.g., dependency groups'
    required: false
    default: '--group test'

runs:
  using: "composite"
  steps:
    - name: Install system dependencies for CI
      run: |
         sudo apt-get install time git libgit2-dev ninja-build libyaml-dev libgraphviz-dev googletest libgtest-dev
      shell: bash
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      run: |
        uv sync --locked ${{ inputs.uv-sync-args }}
      shell: bash
