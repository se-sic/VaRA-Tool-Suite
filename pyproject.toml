[project]
name = "varats"
version = "14.1.0"
dependencies = [
  "Jinja2>=3.1.6",
  "PyDriller>=2.9",
  "PyGithub>=2.8.1",
  "PyQt5-stubs>=5.15.6.0",
  "PyQt5>=5.15.11",
  "PyYAML>=6.0.3",
  "benchbuild>=6.8",
  "click>=8.3.1",
  "cliffs-delta>=1.0.0",
  "distro>=1.9.0",
  "graphviz>=0.21",
  "ijson>=3.4.0.post0",
  "kaleido>=1.2.0",
  "matplotlib>=3.10.8",
  "networkx>=3.6.1",
  "numpy>=2.4.1",
  "packaging>=26.0",
  "pandas>=3.0.0",
  "plotly>=6.5.2",
  "plumbum>=1.10.0",
  "pygit2>=1.19.1,<1.20.0",
  "pygraphviz>=1.14",
  "pygtrie>=2.5.0",
  "pylatex>=1.4.2",
  "requests>=2.32.5",
  "rich>=14.3.1",
  "scikit-learn>=1.8.0",
  "seaborn>=0.13.2",
  "tabulate>=0.9",
  "wllvm>=1.3.1",
]
requires-python = ">=3.11"
maintainers = [
  { name = "Florian Sattler", email = "sattlerf@cs.uni-saarland.de" }
]
readme = "README.md"
license = "BSD-2-Clause"

[project.scripts]
vara-art = "varats.tools.driver_artefacts:main"
vara-buildsetup = "varats.tools.driver_build_setup:main"
vara-config = "varats.tools.driver_config:main"
vara-container = "varats.tools.driver_container:main"
vara-cs = "varats.tools.driver_casestudy:main"
vara-cs-gui = "varats.tools.driver_casestudy_gui:main"
vara-develop = "varats.tools.driver_develop:main"
vd = "varats.tools.driver_develop:main"
vara-gen-bbconfig = "varats.tools.driver_gen_benchbuild_config:main"
vara-pc = "varats.tools.driver_paper_config:main"
vara-plot = "varats.tools.driver_plot:main"
vara-run = "varats.tools.driver_run:main"
vara-table = "varats.tools.driver_table:main"
vara-cve = "varats.tools.driver_cve:main"

[project.gui-scripts]
vara-graphview = "varats.tools.driver_graph_view:main"
vara-buildsetup-gui = "varats.tools.driver_build_setup_gui:main"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
varats = "varats/varats"
"varats.containers" = "varats/varats/containers"
"varats.data" = "varats/varats/data"
"varats.data.databases" = "varats/varats/data/databases"
"varats.data.reports" = "varats/varats/data/reports"
"varats.experiments" = "varats/varats/experiments"
"varats.experiments.base" = "varats/varats/experiments/base"
"varats.experiments.phasar" = "varats/varats/experiments/phasar"
"varats.experiments.szz" = "varats/varats/experiments/szz"
"varats.experiments.vara" = "varats/varats/experiments/vara"
"varats.gui" = "varats/varats/gui"
"varats.gui.cs_gen" = "varats/varats/gui/cs_gen"
"varats.gui.views" = "varats/varats/gui/views"
"varats.jupyterhelper" = "varats/varats/jupyterhelper"
"varats.paper_mgmt" = "varats/varats/paper_mgmt"
"varats.plot" = "varats/varats/plot"
"varats.plots" = "varats/varats/plots"
"varats.projects" = "varats/varats/projects"
"varats.projects.cpp_projects" = "varats/varats/projects/cpp_projects"
"varats.projects.c_projects" = "varats/varats/projects/c_projects"
"varats.projects.perf_tests" = "varats/varats/projects/perf_tests"
"varats.projects.test_projects" = "varats/varats/projects/test_projects"
"varats.table" = "varats/varats/table"
"varats.tables" = "varats/varats/tables"
"varats.tools" = "varats/varats/tools"
"varats.tools.research_tools" = "varats/varats/tools/research_tools"
"varats.tools.templates" = "varats/varats/tools/templates"
"varats.ts_utils" = "varats/varats/ts_utils"
"varats.base" = "varats-core/varats/base"
"varats.experiment" = "varats-core/varats/experiment"
"varats.experiment.steps" = "varats-core/varats/experiment/steps"
"varats.mapping" = "varats-core/varats/mapping"
"varats.paper" = "varats-core/varats/paper"
"varats.project" = "varats-core/varats/project"
"varats.provider" = "varats-core/varats/provider"
"varats.provider.bug" = "varats-core/varats/provider/bug"
"varats.provider.cve" = "varats-core/varats/provider/cve"
"varats.provider.feature" = "varats-core/varats/provider/feature"
"varats.provider.patch" = "varats-core/varats/provider/patch"
"varats.provider.release" = "varats-core/varats/provider/release"
"varats.report" = "varats-core/varats/report"
"varats.revision" = "varats-core/varats/revision"
"varats.utils" = "varats-core/varats/utils"

[tool.pytest.ini_options]
testpaths = ["varats", "varats-core", "tests"]
addopts = "--doctest-modules --doctest-continue-on-failure --ignore=varats/projects/c_projects/gzip.py"
markers = [
    "slow: this test is slow."
]

[tool.ruff]
line-length = 80
exclude = ["CVS", "gui", "filtertree_data.py", ".eggs", "docs/source/conf.py",]
indent-width = 4

[tool.ruff.lint]
select = [
  # Core Python correctness
  "F",      # Pyflakes (undefined names, unused imports, etc.)
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings

  # Import sorting (replaces isort)
  "I",

  # Naming conventions (replaces BASIC naming rules)
  "N",

  # Full Pylint coverage available in Ruff
  "PLE",    # pylint errors
  "PLW",    # pylint warnings
  "PLR",    # pylint refactor
  "PLC",    # pylint convention rules
]

# Ignoring specific rules that conflict with pre-ruff setup or are not needed
ignore = [
  "G004", # logging-f-string
  "PLR2004", # magic-value-comparison
  "PLR5501", # collapsible-else-if
]

[tool.ruff.lint.isort]
known-first-party = ["varats"]
known-third-party = ["benchbuild", "enchant"]


# Pylint settings to match .pylintrc configuration
[tool.ruff.lint.pylint]
max-args = 10
max-bool-expr=6
max-branches=12
max-locals=20
max-positional-args=10
max-public-methods=20
max-returns=6
max-statements=50
max-nested-blocks=5


[tool.mypy]
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
mypy_path = "varats/:varats-core/"
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
plugins = [
  "numpy.typing.mypy_plugin"
]

[[tool.mypy.overrides]]
module = [
  "pylatex",
  "benchbuild.*",
  "plumbum.*",
  "matplotlib.*",
  "networkx.*",
  "pandas",
  "plotly.*",
  "pydriller",
  "pygtrie",
  "scipy.*",
  "sklearn.*",
  "PyQt5.*",
  "seaborn",
  "github.*",
  "ijson",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "varats.gui.views.*",
  "varats.gui.ui_MainWindow",
  "varats.gui.*",
]
ignore_errors = true

[tool.coverage.run]
source = [
  "tests/",
  "varats/varats/",
  "varats-core/varats/"
]
source_pkgs = ["varats", "varats-core"]
parallel = true

[tool.coverage.report]
ignore_errors = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion=3.0.0
skipsdist=True
distdir={toxworkdir}/wheel_output

[testenv]
deps =
  -rrequirements.txt
  pytest
  coverage
commands =
  coverage run -m pytest varats/varats/
  coverage report -m --skip-covered

[testenv:mypy]
deps =
  -rrequirements.txt
  mypy
commands =
  mypy --strict -p varats

[testenv:release]
deps =
  -rrequirements.txt
  wheel
  twine
commands =
  pip3 wheel --no-deps -w {distdir} .
  twine upload --skip-existing -r pypi {distdir}/varats*

[testenv:test-release]
deps =
  -rrequirements.txt
  wheel
  twine
commands =
  pip3 wheel --no-deps -w {distdir} .
  twine upload --skip-existing -r testpypi {distdir}/varats*
"""
